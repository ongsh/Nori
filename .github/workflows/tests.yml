name: P1 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q nori tests
      - run: python -m nori demo "$RUNNER_TEMP/nori-demo"
      - run: python scripts/build_distribution.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: nori-linux-wsl2
          path: |
            dist/nori.pyz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_browser.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nori-browser-smoke
          path: dist/browser-smoke.png
